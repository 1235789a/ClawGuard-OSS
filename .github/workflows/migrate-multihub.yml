name: One-time MultiHub migration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    if: github.event.head_commit.message == 'Prepare MultiHub Site Check migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace project with MultiHub Site Check
        env:
          PATCH_B64: 
        run: |
          git clone --depth 1 https://github.com/Lissy93/web-check.git /tmp/web-check-upstream
          rsync -a --delete --exclude=.git /tmp/web-check-upstream/ ./
          printf '%s' "$PATCH_B64" | base64 --decode | git apply --binary
          git config user.name "MultiHub Migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Replace LocalBiz Copilot with MultiHub Site Check"
          git push origin main
