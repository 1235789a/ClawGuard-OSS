name = "localbiz-copilot"
compatibility_date = "2026-08-26"
pages_build_output_dir = "dist"

# Create a D1 database, then replace the placeholder below before deploying.
[[d1_databases]]
binding = "DB"
database_name = "localbiz-copilot"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# Keep AI_API_KEY out of this file. Set it with `wrangler pages secret put AI_API_KEY`.
AI_PROVIDER = "openai-compatible"
AI_BASE_URL = ""
AI_MODEL = ""
MULTIHUB_GEO_URL = ""
